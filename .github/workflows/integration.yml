name: Controlled Open WebUI integration

"on":
  workflow_dispatch:
    inputs:
      confirm_isolated:
        description: Confirm the pinned synthetic loopback-only lab and approved artifact downloads
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  integration:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_isolated }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the isolated integration checks
        run: bash scripts/verification/run-integration.sh --confirm-isolated "$RUNNER_TEMP/p006-integration"
      - name: Publish integration status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p006-integration-status
          path: ${{ runner.temp }}/p006-integration/integration.json
          if-no-files-found: error
          retention-days: 14
